model_list:
  - model_name: analyzer
    litellm_params:
      model: github_copilot/gpt-4o
  - model_name: scenario_gen
    litellm_params:
      model: github_copilot/gpt-4o
  - model_name: verifier
    litellm_params:
      model: github_copilot/gpt-4o
  - model_name: fallback
    litellm_params:
      model: github_copilot/gpt-4o-mini

router_settings:
  routing_strategy: simple-shuffle
  num_retries: 2
  timeout: 300
  allowed_fails: 3
  fallbacks:
    - analyzer: [fallback]
    - scenario_gen: [fallback]
    - verifier: [fallback]

litellm_settings:
  drop_params: true
  num_retries: 2
  request_timeout: 300

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
